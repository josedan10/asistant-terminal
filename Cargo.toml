[workspace]
resolver = "3"
members = ["crates/*", "apps/desktop/src-tauri"]

[workspace.package]
version = "0.0.1"
edition = "2024"
license = "MIT"
publish = false
rust-version = "1.100"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
thiserror = "2"
clap = { version = "4", features = ["derive"] }
ts-rs = "12"
insta = { version = "1.49", features = ["json"] }
proptest = "1"
assert_cmd = "2"
predicates = "3"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }

[profile.release]
lto = "thin"
strip = true
codegen-units = 1
